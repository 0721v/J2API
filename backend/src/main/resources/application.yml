# API Platform Backend Configuration
# API聚合平台后端配置文件
# 此文件包含所有环境共用的配置
# 特定环境的配置请在 application-dev.yml 或 application-prod.yml 中定义

# 服务器配置
server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# Spring配置
spring:
  application:
    name: api-platform
  
  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  
  # 数据库基础配置（具体连接信息在各环境配置中）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: ApiPlatformHikariCP
  
  # Redis基础配置（具体连接信息在各环境配置中）
  redis:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  
  # i18n配置
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.apiplatform.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT基础配置（密钥在各环境配置中）
jwt:
  expiration: 86400000        # 24小时
  refresh-expiration: 604800000  # 7天

# 系统配置
system:
  name: API Platform
  version: 1.0.0
  description: API聚合与计费管理平台
  support-email: support@example.com
  
  # Token配置
  token:
    prefix: sk-
    length: 32
    renew-days: 30
  
  # 计费配置
  billing:
    cache-hit-rate: 0.5          # 缓存命中率时的计费比例
    enable-cache-billing: true
  
  # 限流配置
  rate-limit:
    enabled: true
    default-minute-limit: 60
    default-day-limit: 10000

# 渠道配置
channels:
  retry:
    max-attempts: 3
    backoff:
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 10000

# 支付基础配置
payment:
  # 支付宝基础配置
  alipay:
    enabled: false
  
  # 微信支付基础配置
  wechat:
    enabled: false
  
  # 欧易(OKX)加密货币配置
  okx:
    enabled: false
    endpoint: https://www.okx.com
    network: TRC20              # TRC20 或 ERC20
    discount: 0.95              # 加密货币支付95折
  
  # Stripe基础配置
  stripe:
    enabled: false
    currency: usd
  
  # Creem基础配置
  creem:
    enabled: false
    endpoint: https://api.creem.io
    currency: usd

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
    resolve-schema-properties: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    # 中文界面配置
    supported-submit-methods: ["get", "put", "post", "delete", "options", "head", "patch", "trace"]
    display-request-duration: true
    default-model-expand-depth: 2
    default-model-render-depth: 2
    locale: zh-CN

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized